# =============================================
# Configuración de base de datos MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/parkapp
spring.datasource.username=root
spring.datasource.password=2726
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =============================================
# Configuración de Hibernate / JPA
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =============================================
# Configuración de vistas JSP
# =============================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# =============================================
# Servidor embebido
# =============================================
server.port=8080

# =============================================
# Desactivar usuario por defecto de Spring Security
# =============================================
spring.security.user.name=disable
spring.security.user.password=disable

# =============================================
# Nivel de log (útil para depuración de seguridad)
# =============================================
logging.level.org.springframework.security=INFO

# =============================================
# Carga automática de data.sql al iniciar
# =============================================
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
